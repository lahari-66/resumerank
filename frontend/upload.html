<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ResumeRank – Upload Resume</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>ResumeRank</h1>
    <span>Candidate upload</span>
  </header>

  <main>
    <section class="card" id="job-card">
      <h2 id="job-title">Loading job…</h2>
      <p class="meta" id="job-meta"></p>
    </section>

    <section class="card">
      <h2>Submit your resume</h2>
      <form id="upload-form" novalidate>
        <label for="job-id">Job ID</label>
        <input type="text" id="job-id" class="mono" required placeholder="paste the job id from the recruiter">

        <div class="row">
          <div>
            <label for="name">Full name</label>
            <input type="text" id="name" maxlength="200" required>
          </div>
          <div>
            <label for="email">Email</label>
            <input type="email" id="email" maxlength="200" required>
          </div>
        </div>

        <label for="file">Resume (PDF, up to 5 MB)</label>
        <input type="file" id="file" accept="application/pdf,.pdf" required>

        <button type="submit" id="submit">Upload resume</button>
      </form>
      <div class="message" id="message" role="status"></div>
    </section>

    <p class="meta">Your resume is stored privately and deleted automatically after 7 days. The score
      only orders resumes for a human recruiter to review; it is not a hiring decision.</p>
  </main>

  <footer>ResumeRank · course project · serverless on AWS</footer>

  <script src="config.js"></script>
  <script>
    const API = ((window.RESUMERANK_CONFIG || {}).apiBaseUrl || "").replace(/\/+$/, "");
    const MAX_BYTES = 5 * 1024 * 1024;

    const form = document.getElementById("upload-form");
    const jobIdInput = document.getElementById("job-id");
    const submitBtn = document.getElementById("submit");
    const msg = document.getElementById("message");

    function show(text, kind) {
      msg.textContent = text;
      msg.className = "message show " + kind;
    }

    async function api(path, options) {
      const res = await fetch(API + path, options);
      let data = {};
      try { data = await res.json(); } catch (e) { /* empty body */ }
      if (!res.ok) throw new Error(data.error || ("request failed with status " + res.status));
      return data;
    }

    async function loadJob(jobId) {
      const title = document.getElementById("job-title");
      const meta = document.getElementById("job-meta");
      if (!jobId) {
        title.textContent = "No job selected";
        meta.textContent = "Open the link the recruiter shared, or paste the job id below.";
        return;
      }
      try {
        const data = await api("/candidates?jobId=" + encodeURIComponent(jobId));
        title.textContent = data.job.title;
        meta.textContent = "Required skills: " + data.job.requiredSkills.join(", ") +
          " · Minimum experience: " + data.job.minYears + " year(s)";
      } catch (e) {
        title.textContent = "Job not found";
        meta.textContent = e.message;
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!API) { show("config.js is missing the API URL.", "error"); return; }

      const jobId = jobIdInput.value.trim();
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const file = document.getElementById("file").files[0];

      if (!jobId || !name || !email || !file) { show("Please fill in every field and choose a PDF.", "error"); return; }
      if (file.type !== "application/pdf" && !file.name.toLowerCase().endsWith(".pdf")) {
        show("Only PDF files are accepted.", "error"); return;
      }
      if (file.size > MAX_BYTES) { show("The file is larger than 5 MB.", "error"); return; }

      submitBtn.disabled = true;
      try {
        show("Requesting a secure upload link…", "info");
        const signed = await api("/upload-url", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ jobId, name, email, contentType: "application/pdf", fileSize: file.size }),
        });

        show("Uploading " + file.name + "…", "info");
        const put = await fetch(signed.uploadUrl, { method: "PUT", headers: signed.headers, body: file });
        if (!put.ok) throw new Error("upload to storage failed with status " + put.status);

        show("Uploaded. Your resume is being processed – reference " + signed.candidateId + ".", "ok");
        form.reset();
        jobIdInput.value = jobId;
      } catch (e) {
        show("Upload failed: " + e.message, "error");
      } finally {
        submitBtn.disabled = false;
      }
    });

    const initialJob = new URLSearchParams(location.search).get("jobId") || "";
    jobIdInput.value = initialJob;
    jobIdInput.addEventListener("change", () => loadJob(jobIdInput.value.trim()));
    loadJob(initialJob);
  </script>
</body>
</html>
